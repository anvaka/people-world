# Every pull request from a branch of this repository gets a preview of the page at
# https://anvaka.github.io/people-world/pr-preview/pr-<number>/
# with a comment (and a QR code for phones) on the pull request. Each push updates it;
# closing or merging the pull request removes it.
name: Preview pull request

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency: preview-${{ github.ref }}

jobs:
  preview:
    # Pull requests from forks get a read-only token and can't push a preview.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect the site
        if: github.event.action != 'closed'
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site --exclude=.github --exclude=tools

      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
