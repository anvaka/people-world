# Publishes the site from main to the gh-pages branch, which GitHub Pages serves.
# Pull request previews live in gh-pages/pr-preview/ (see preview.yml); this keeps them.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect the site
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site --exclude=.github --exclude=tools
          touch _site/.nojekyll

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
